    <script type="text/javascript">
      const PI_DIV_HALF = Math.PI / 180.0;
      const HALF_DIV_PI = 180.0 / Math.PI;

      // ##########################################################
      function showInfo(obj) {
        console.log(obj);
        for (var key in obj) {
          try {
            console.log(key + " : " + obj[key]);
          } catch (e) {
            console.log(key + " : ", e.name);
          }
        }
      }
      // ##########################################################
      // Degre -> Radian
      function d2r(degree) {
        return degree * PI_DIV_HALF;
      }
      // Radian -> Degree
      function r2d(radian) {
        return radian * HALF_DIV_PI;
      }
      // ##########################################################
      // num을 소수점 아래 digit번째까지 남기고 버림.
      function floor2(num, digit) {
        var pow = Math.pow(10, digit);
        return Math.floor(num * pow) / pow;
      }
      // num을 소수점 아래 digit번째 wkflfh dhffla.
      function ceil2(num, digit) {
        var pow = Math.pow(10, digit);
        return Math.ceil(num * pow) / pow;
      }
      // num을 소수점 아래 digit번째까지 남기고 반올림.
      function round2(num, digit) {
        var pow = Math.pow(10, digit);
        return Math.round(num * pow) / pow;
      }
      // num값을 최소 min, 최대 max로 제한시켜 반환합니다.
      function limitNumber(num, min, max) {
        if (num < min) return min;
        if (num > max) return max;
        return num;
      }
      // ##########################################################
      function formatInt(num, size, prefix) {
        var str = new String(Math.abs(num));
        var preStr = num < 0 ? "-" : "";
        var gap = size - str.length;
        for (var i = 0; i < gap; i++) {
          preStr += prefix;
        }
        return preStr + str;
      }
      // ##########################################################
      // 문자 ch가 숫자 문자인가?
      function isNum(ch) {
        return ch >= "0" && ch <= "9";
      }
      // 문자 ch가 알파벳인가?
      function isAlpha(ch) {
        return (ch >= "a" && ch <= "z") || (ch >= "A" && ch <= "Z");
      }
      // 문자 ch가 한글인가?
      function isHangul(ch) {
        return (
          (ch >= "가" && ch <= "힣") ||
          (ch >= "ㄱ" && ch <= "ㅎ") ||
          (ch >= "ㅏ" && ch <= "ㅣ")
        );
      }
      // ##########################################################
      // 이름 생성(임의의 10글자 알파벳)
      function makeName() {
        const ch = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        let ret = "";
        for (let i = 0; i < 10; i++) {
          ret += ch.charAt(Math.floor(Math.random() * ch.length));
        }
        return ret;
      }
    </script>
    <script type="text/javascript">
      /*
       * 페이지를 닫아도 유지되는 저장소.
       */
      // ##########################################################
      function Storage(name) {
        this.name = name + ".";
      }
      // ##########################################################
      // 저장소의 이름을 설정합니다.
      Storage.prototype.init = function (name) {
        this.name = name + ".";
      };
      // 저장소의 모든 값을 콘솔에 출력합니다.
      Storage.protorype.printAll = function () {
        var buf = "";
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key.indexOf(this.name) == 0) {
            buf += key + " : " + localStorage.getItem(key) + "\n";
          }
        }
        console.log(buf);
      };
      // 저장소의 모든 값을 제거합니다.
      Storage.protorype.clear = function () {
        for (var key in window.localStorage) {
          if (key.indexOf(this.name) == 0) {
            localStorage.removeItem(key);
          }
        }
      };
      // ##########################################################
      // 저장소가 key에 해당하는 값을 가지고 있는지 반환합니다.
      Storage.prototype.contains = function (key) {
        var realKey = this.name + key;
        return (
          realKey in window.localStorage &&
          window.localStorage[realKey] != undefined
        );
      };
      // 저장소의 key data를 저장합니다.
      Storage.prototype.set = function (key, data) {
        window.localStorage[this.name + key] = data;
      };
      // 저장소의 key에 해당하는 값을 제거합니다.
      Storage.prototype.remove = function (key) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          localStorage.removeItem(realKey);
        }
      };
      // 저장소의 key에 해당하는 값을 반환합니다.
      Storage.prototype.get = function (key) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return window.localStorage[realKey];
        }
        return undefined;
      };
      // 저장소의 key에 해당하는 값을 반환합니다. 없으면 defaultValue를 반환합니다.
      // 값은 문자열입니다.
      Storage.prototype.getOrDefault = function (key, defaultValue) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return window.localStorage[realKey];
        }
        return defaultValue;
      };
      // 저장소의 key에 해당하는 값을 정수형으로 바꾸어 반환합니다.
      Storage.prototype.getInt = function (key) {
        return parseInt(this.get(key));
      };
      // 저장소의 key에 해당하는 값을 정수형으로 바꾸어 반환합니다. 없으면 defaultValue를 반환합니다.
      Storage.prototype.getIntOrDefault = function (key, defaultValue) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return parseInt(window.localStorage[realKey]);
        }
        return defaultValue;
      };
      // 저장소의 key에 해당하는 값을 실수형으로 바꾸어 반환합니다.
      Storage.prototype.getFloat = function (key) {
        return parseFloat(this.get(key));
      };
      // 저장소의 key에 해당하는 값을 실수형으로 바꾸어 반환합니다. 없으면 defaultValue를 반환합니다.
      Storage.prototype.getFloatOrDefault = function (key, defaultValue) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return parseFloat(window.localStorage[realKey]);
        }
        return defaultValue;
      };
      // ##########################################################
      const g_db = new Storage("whatbox.program.music_player");
    </script>
    <script type="text/javascript">
      /*
       * 2차원 벡터
       */
      function Vector(x, y) {
        this.x = x;
        this.y = y;
      }
      // x와 y가 0인 벡터를 반환합니다.
      Vector.zero = function () {
        return new Vector(0, 0);
      };
      // ##########################################################
      // 현재 벡터의 x,y값을 재설정합니다.
      Vector.prototype.set = function (x, y) {
        this.x = x;
        this.y = y;
      };
      // 현재 벡터를 x,y만큼 이동시킵니다.
      Vector.prototype.move = function (x, y) {
        this.x += x;
        this.y += y;
      };
    </script>
    <script type="text/javascript">
      /*
       * 마우스
       */
      // ##########################################################
      function Mouse() {
        this.NONE = 0;
        this.UP = 1;
        this.PRESS = 2;
        this.DOWN = 3;
        this.backBuffer = this.NONE;
        this.state = this.NONE;
        this.wheelBackBuffer = this.NONE;
        this.wheelState = this.NONE;
        this.client = null;
        this.cursor = new Vector(-1, -1);
        this.prevCursor = new Vector(-1, -1);
        this.deltaCursor = Vector.zero();
      }
      // ##########################################################
      Mouse.prototype.init = function (win, client) {
        this.client = client;
        this.cursor.x = win.innerWidth / 2;
        this.cursor.y = win.innerHeight / 2;
        this.prevCursor.x = this.cursor.x;
        this.prevCursor.y = this.cursor.y;
        win.onmosedown = this.whenDown.bind(this);
        win.onmouseup = this.whenUp.bind(this);
        win.onmousemove = this.whenMove.bind(this);
        win.onmousewheel = this.whenWheel.bind(this);
      };
      Mouse.prototype.reset = function () {
        this.backBuffer = this.NONE;
        this.state = this.NONE;
        this.wheelBackBuffer = this.NONE;
        this.wheelState = this.NONE;
        this.deltaCursor.set(0, 0);
      };
      Mouse.prototype.update = function () {
        var newState = this.backBuffer;
        if (this.state == this.DOWN) {
          this.state = this.Press;
        } else if (this.state == this.UP) {
          this.state = this.NONE;
        }
        if (newState == this.DOWN && this.state == this.NONE) {
          this.state = this.DOWN;
        } else if (newState == this.UP) {
          this.state = this.UP;
        }
        this.backBuffer = this.NONE;
        if (this.wheelState == this.DOWN || this.wheelState == this.UP) {
          this.wheelState = this.NONE;
        }
        this.wheelState = this.wheelBackbuffer;
        this.wheelBackBuffer = this.NONE;
        this.deltaCursor.x = this.cursor.x - this.prevCursor.x;
        this.deltaCursor.y = this.cursor.y - this.prevCursor.y;
        this.prevCursor.x = this.cursor.x;
        this.prevCursor.y = this.cursor.y;
        // ##########################################################
        Mouse.prototype.calculateCursorFrom = function (arg) {
          this.cursor.x = arg.x - this.client.offsetLeft;
          this.cursor.y = arg.y - this.client.offsetTop;
        };
        Mouse.prototype.whenDown = function (arg) {
          this.backBuffer = this.DOWN;
          this.calculateCursorFrom(arg);
        };
        Mouse.prototype.whenUp = function (arg) {
          this.backBuffer = this.UP;
          this.calculateCursorFrom(arg);
        };
        Mouse.prototype.whenMove = function (arg) {
          this.calculateCursorFrom(arg);
        };
        Mouse.prototype.whenWheel = function (arg) {
          this.wheelBackBuffer = arg.wheelDelta > 0 ? this.UP : this.DOWN;
        };
        // ##########################################################
        // 마우스가 안눌린 상태에서 눌린 상태로 변환 시점인가?
        // 상승 예지
        Mouse.prototype.onDown = function () {
          return this.state == this.DOWN;
        };
        // 마우스가 눌린 상태에서 안눌린 상태로 변환 시점인가?
        // 하강 예지
        Mouse.prototype.onUp = function () {
          return this.state == this.UP;
        };
        // 마우스가 눌린 상태를 유지한 상태인가?
        Mouse.prototype.onPressed = function () {
          return this.state == this.PRESS;
        };
        // 마우스 휠이 위로 스크롤 된 상태로 변한 시점인가?
        Mouse.prototype.onWheelUp = function () {
          return this.wheelState == this.UP;
        };
        // 캔버스에서의 마우스 좌표를 반환.
        Mouse.prototype.getCursor = function () {
          return this.cursor;
        };
        // 캔버스에서의ㅡ 마우스 좌표 변위를 반환
        Mouse.prototype.getDelta = function () {
          return this.deltaCursor;
        };
      };
      // ##########################################################
      const g_mouse = new Mouse();
    </script>
    <script type="text/javascript">
      /*
       * 키보드
       */
      // ##########################################################
      function Keyboard() {
        this.NONE = 0;
        this.UP = 1;
        this.PRESS = 2;
        this.DOWN = 3;
        this.BUFF_SIZE = 1024;
        this.backBuffer = new Array(this.BUFF_SIZE);
        this.buffer = new Array(this.BUFF_SIZE);
        this.state = new Array(this.BUFF_SIZE);
        this.continualDown = false;
        this.ignoreKey = false;
      }
      // ##########################################################
      Keyboard.prototype.init = function (win) {
        this.reset();
        win.onkeydown = this.whenDown.bind(this);
        win.onkeyup = this.whenUp.bind(this);
      };
      Keyboard.prototype.reset = function () {
        for (var i = 0; i < this.BUFF_SIZE; ++i) {
          this.backBuffer[i] = this.NONE;
          this.buffer[i] = this.NONE;
          this.state[i] = this.NONE;
        }
        this.ignoreFunctionKey(false);
      };
      Keyboard.prototype.update = function () {
        for (var i = 0; i < this.BUFF_SIZE; ++i) {
          this.buffer[i] = this.backBuffer[i];
          if (this.state[i] == this.DOWN) {
            this.state[i] = this.PRESS;
          } else if (this.state[i] == this.UP) {
            this.state[i] = this.NONE;
          }
          if (
            this.buffer[i] == this.DOWN &&
            (this.continualDown || this.state[i] == this.NONE)
          ) {
            this.state[i] = this.DOWN;
          } else if (this.buffer[i] == this.UP) {
            this.state[i] = this.UP;
          }
          this.backBuffer[i] = this.NONE;
        }
      };
      // 키를 꾹 눌렀을 때 onDown 이벤트가 지속적으로 발생하게 할지?
      // isOn(true): 지속적으로 발생.
      // isOn(false): 키를 누른 순간에만 발생.
      Keyboard.prototype.repeatDown = function (isOn) {
        this.continualDown = isOn;
      };
      // 브라우저가 키를 처리하지 않도록 할지?
      // isOn(true): 브라우저가 키를 처리하지 않음.
      // isOn(false): 브라우저가 키를 처리함.
      Keyboard.prototype.ignoreFunctionKey = function (isOn) {
        this.ignoreKey = isOn;
      };
      // ##########################################################
      Keyboard.prototype.whenDown = function (arg) {
        this.backBuffer[arg.keyCode] = this.DOWN;
        // 기능키는 처리되도록 함.
        if (
          arg.keyCode == Keys.F11 ||
          arg.keyCode == Keys.F12 ||
          arg.keyCode == Keys.F5
        ) {
          return true;
        }
        if (arg.keyCode == Keys.Alt) {
          return false;
        }
        return !this.ignoreKey;
      };
      Keyboard.prototype.whenUp = function (arg) {
        this.backBuffer[arg.keyCode] = this.UP;
      };
      // ##########################################################
      // key가 안눌린 상태에서 눌린 상태로 변한 시점인가?
      // 상승 예지
      Keyboard.prototype.onDown = function (key) {
        return this.state[key] == this.DOWN;
      };
      // key가 눌린 상태에서 안눌린 상태로 변한 시점인가?
      // 하강 예지
      Keyboard.prototype.onUp = function (key) {
        return this.state[key] == this.UP;
      };
      // key가 눌린 상태를 유지한 상태인가?
      // repeatDown(true) 상태에서는 onDOwn에서도 true를 반환한다.
      Keyboard.prototype.onPressed = function (key) {
        return (
          this.state[key] == this.PRESS ||
          (this.continualDown && this.state[key] == this.DOWN)
        );
      };
      // ##########################################################

    <script type="text/javascript">
      /*
       * 그래픽 출력

          // 캐시 크기가 너무 커지면 비움.
          if (MusicMaker.waveCache.size >= MusicMaker.MAX_CACHE_SIZE) {
            MusicMaker.waveCache.clear();
          }
          cache = new Map();
          MusicMaker.waveCache.set(waveKey, cache);
        }
        // 캐시 크기가 너무 커지면 비움.
        if (cache.size >= MusicMaker.MAX_SUBCACHE_SIZE) {
          cache.clear();
        }
        // 없으면 새로 만듬.
        var buffer = MusicMaker.makeWave(
          convWaves,
          scale,
          time,
          opMap || new Map(),
        );
        cache.set(subKey, buffer);
        return buffer;
      };
      MusicMaker.makeWave = function (convWaves, scale, time, opMap) {
        const rate = 44100;
        const freq = Sound.scaleToFrequency(scale, 0);
        var buffer = [];
        // 파형 합성
        for (var w = 0; w < convWaves.length; ++w) {
          var waveName = convWaves[w][0];
          var waveVolume = convWaves[w][1];
          var waveHarmonic = 1;
          if (opMap.has(waveName) == false) {
            var nameEndIndex = -1;
            for (var i = 0; i < waveName.length; ++i) {
              if (isNum(waveName[i]) || waveName[i] == ".") {
                nameEndIndex = i;
                break;
              }
            }
            if (nameEndIndex >= 0) {
              waveHarmonic = parseFloat(
                waveName.substring(nameEndIndex, waveName.length),
              );
              waveName = waveName.substr(0, nameEndIndex);
            }
          }
          var wave = null;
          var soundFunc = Sound.makeSinWave.bind(Sound);
          if (waveName == "sin") {
            soundFunc = Sound.makeSinWave.bind(Sound);
          } else if (waveName == "sqr") {
            soundFunc = Sound.makeSquareWave.bind(Sound);
          } else if (waveName == "tri") {
            soundFunc = Sound.makeTriangleWave.bind(Sound);
          } else if (waveName == "saw") {
            soundFunc = Sound.makeSawWave.bind(Sound);
          } else if (waveName == "noise") {
            soundFunc = function (frequency, amplitude, duration, sampleRate) {
              Sound.makeWave(frequency, duration, sampleRate, function (deg) {
                return Math.random() * 2 * amplitude - amplitude;
              });
            };
          } else if (opMap.has(waveName)) {
            var sampleRate = 44100;
            var modulator = opMap.get(waveName);
            wave = new Array(Math.ceil(sampleRate * time));
            var mulFreq = freq * waveHarmonic;
            if (modulator.reset) {
              modulator.reset();
            }
            for (var t = 0; t < wave.length; ++t) {
              wave[t] =
                modulator.calculate(t / sampleRate, mulFreq, 0, []) *
                waveVolume;
            }
          }
          if (wave == null) {
            wave = soundFunc(freq * waveHarmonic, waveVolume, time, rate);
          }
          while (buffer.length < wave.length) {
            buffer.push(0);
          }
          for (var i = 0; i < wave.length; ++i) {
            buffer[i] += wave[i];
          }
        }
        if (buffer.length <= 0) {
          buffer = Sound.makeSinWave(freq, 1, time, rate);
        }
        // 정규화
        var maxVolume = 1;
        for (var i = 0; i < buffer.length; ++i) {
          var abs = Math.abs(buffer[i]);
          if (maxVolume < abs) {
            maxVolume = abs;
          }
        }
        for (var i = 0; i < buffer.length; ++i) {
          buffer[i] /= maxVolume;
        }
        return buffer;
      };
    </script>
