<인터페이스 - 공통>

- Save : 만든 악보를 저장합니다.

<직접 만들기>
도미솔 화음 연주해보기

- 악보 입력란을 비웁니다.
- 첫째 줄에 "$ 튜토리얼"이라고 곡 제목을 입력합니다.
- '$'는 주석 명령어입니다. 한 줄에서 이 문자 뒤의 내용은
  무시됩니다.
- 다음 줄에 "- Main"을 적어서 채널을 선언합니다.
  채널이 하나일 경우에도 지정하는 것이 권장됩니다.
- 다음 줄에 "~sqr1"을 적어서 파형을 설정합니다.
  1배음의 사각파를 뜻합니다.

  (sin: 사인파, sqr: 사각파, tri: 삼각파, saw: 톱니파)

새로운 파형이 지정되기 전까지 이렇게 설정한 파형으로 음이
연주됩니다.

각 파형, 배음의 조합에 따라 여러 음색을 표현할 수 있습니다.

- 다음 줄에 "*100"을 적어서 ms per beat를 설정합니다.
  추후 나오겠지만 음의 길이는 비트 단위로 표현하며
  "*100"은 한 비트당 100ms(0.1초)로 설정하라는 말입니다.
  즉, 이 값이 작을수록 곡이 빠르게 연주됩니다.

- 이제 음을 찍기 위한 기본적인 준비가 끝났습니다.
  참고로 파형, 속도 등의 정보는 채널별로 독립적이라 따로
  설정해주어야 합니다.

- 여기서 음을 나타내는 알파벳과 반음 올림을 나타내는 '#',
  옥타브, 길이로 표현됩니다.
  예를 들어 "c#4 2"라고 하면 4옥타브에서 [판독 불확실]
  의 길이로 연주하라는 뜻입니다.
  (반음 내림을 표현하는 기호는 없습니다. 올림으로 대체하셔야 합니다.)

- 우리의 목표는 도, 미, 솔 차례로 연주한 다음 다시 동시에
  연주하는 것입니다.

  도~~ 미~~ 솔~~ (도미솔)~~

- 다음 줄에 "c4 5 0"이라고 적고 재생 버튼을 눌러 재생해봅시다.
  c4음이 0.5초간 재생되면 성공입니다.

- 그런데 "c4 5"까지는 설명했지만 그 뒤의 숫자 "0"은 설명하지
  않았습니다.
  음(c4)의 바로 뒤에 붙은 숫자는 음의 길이를 뜻하지만
  그 외의 숫자는 시간의 흐름을 나타냅니다.
  즉, 음을 연주하는 것만으로는 시간이 흐르지 않습니다.
  다르게 말해서 대기 시간이라고도 볼 수 있습니다.

  또한 0은 편의를 위해 이전 숫자와 같은 값을 뜻합니다.
  즉, "c4 5 5"와 같고 이는 "c4를 5비트간 연주하고 시간을
  5비트 흐르게 하라"는 뜻입니다.

- 띄어쓰기를 하고 이어서 "c4 5 0 e4 5 0 g4 5 0"이라고 적고
  재생해봅시다.
  도~~ 미~~ 솔~~ 까지 나왔으면 성공입니다.

- 다음은 동시 연주입니다. 시간의 흐름과 별개라는 특성 덕분에
  동시 연주를 쉽게 할 수 있습니다.
- 띄어쓰기를 하고 이어서 "c4 5 e4 5 g4 5 0"이라고 적고
  재생해봅시다.

축하합니다! 목표를 달성했습니다.

주목해야 할 점은 c4와 e4의 연주 시간이 붙어 있지 않은데도
g4의 시간과 동일하게 적용되었다는 것입니다.
이는 내부 구현에 따른 행동인데 음의 연주 시간이 나오기
전까지는 음을 차곡차곡 기억해두었다가 연주 시간이 나왔을 때
전부 꺼내서 해당 시간으로 연주하기 때문입니다.

즉, "c4 5 e4 5 g4 5 0"이라고 적지 않아도 됩니다.

- 만약 도, 미, 솔 차례로 연주하되 연주를 마치는 건 동시에
  하고 싶다면
  "c4 5 1 e4 4 1 g4 3 0" 이렇게 할 수 있습니다.
  한 번 분석해보세요.

<문법>
계 := c, c#, d, d#, e, f, f#, g, g#, a, a#, b
시간 := (실수(beat))
지연 := (시간)
음 := {계}(옥타브)
지연 동시 연주 := {시작 지연}:{종료 지연}:{종료 지연}
스윕 := {시작음}:{종료음}
옥타브 오프셋 증가/감소 :
  ^1은 1옥타브 상승, ^2는 2옥타브 상승을 뜻하며
  v1은 1옥타브 감소, v2는 2옥타브 감소를 뜻합니다.
  (기호는 사진상 판독 불확실)

옥타브 오프셋이 0(기본)이라는 가정하에 ^1 c4는 c5와 동일하며
v4 c4는 c0과 동일합니다.

옥타브 오프셋은 한번 변경되면 다시 증가/감소하기 전까지 계속
유지됩니다.

- 볼륨 : 실제 볼륨은 채널 볼륨(%)에 일반 볼륨을 곱한 값입니다.
  이를 이용해 악보에서 연주의 강약을 조절하고 전체적인 볼륨은
  볼륨 조절하면 됩니다.
- 반복 : {2 c4 1 0}은 c4 1 0 c4 1 0과 동일합니다.
  이를 이용해 원하는 시점에 반복을 초기화할 수 있습니다.
- 음별 강약 : c4/80 e4/110 4 0처럼 음 뒤의 /0~127로
  각 음의 MIDI 강약을 지정할 수 있습니다.

sin: 사인파
sqr: 사각파
tri: 삼각파
saw: 톱니파
noise: 노이즈 파형

- Main
~sin1:1 +sin1.002:0.18 +sin2.003:0.32 +sin3.009:0.13 +sin4.018:0.07 +sin5.03:0.035
!a3 !d500 !s10 !r180

실제 피아노 녹음은 아니며 사인파 배음과 ADSR로 만든 음색입니다.

파형/연산 정의 :=
  &{이름}:{종류}:{주파수}
  | &{이름}:{종류}{배음}

파형 변조 그래프 연결 :=
  [{이름(변조파)}:{변조지수} > {이름(캐리어)}:{변조지수} > ...]

파형 합성 그래프 :=
  [{이름(파형1)}:{진폭(0~1)} + {이름(파형2)}:{진폭(0~1)} + ...]

<ADSR 문법>
하나의 음에서 파형의 진폭(볼륨)이 어떻게 변화하는지 정의합니다.

A = Attack : 음의 연주가 시작된 시점의 볼륨을 의미하며
  지나야 최대 볼륨에 도달하는 시간(0~ms)
D = Decay : Attack이 끝나고 Sustain 볼륨까지 떨어지는 데
  걸리는 시간(0~ms)
S = Sustain : Decay가 끝나고 음의 연주가 끝나기 전까지 유지되는
  볼륨(0~100%)
R = Release : 음의 연주가 끝난 시점부터 볼륨이 0으로 떨어지는 데
  걸리는 시간(0~ms)

- ex) [a]100 [d]100 [s]30 [r]400 : 연주가 시작되면 0초만에
  바로 최대 볼륨에 도달하고 0.1초 동안 30%로 떨어집니다.
  연주가 끝난 후 0.4초 동안 0%로 떨어집니다.

<기타 문법>
- 스윕 : 피아노의 흰 건반을 손으로 쓸어 연주하는 기법을 표현합니다.
  c4:e4 8이라면 c4에서 e4까지 8비트 동안 쓸어 연주하게 됩니다.

- 지연 동시 연주 : 음을 c4 d4 e4 이렇게 누적한 후 시간을
  4 이렇게 쓰면 동시에 4만큼 연주되지만,
  시간을 4:0.1 이렇게 쓰면 c4 4 0.1 d4 3.9 0.1 e4 3.8 0과
  동일하게 연주되지만 실제로 시간이 흐르지는 않습니다.

  시간을 4:0.1:0.1 이렇게 쓰면 c4 3.8 0.1 d4 3.8 0.1
  e4 3.8 0과 동일하게 연주되지만 역시 시간은 흐르지 않습니다.

  a:b:c일 때는 음수도 가능하며, 대신 마이너스(-0.1) 문자가
  아니라 언더바(_0.1)로 나타냅니다.

  실제 공식은 아래와 같습니다.
  i = 순서(0~)
  L = 음 개수
  음의 시작 시간 = time(i) = i * b
  음의 길이 = span(i) = a - max(c, 0) * (L - 1) + i * (c - b)

- 파형/연산은 sin, sqr, tri, saw 및 noise 파형과
  low, high 패스 필터와 feedback이 있습니다.
- 선언한 파형/연산 및 변조는 채널에 독립적입니다.
- 이렇게 선언한 파형/연산은 기존의 파형 합성 문법인 '~'와 '+'
  에 사용할 수 있습니다.
  예) ~TestWave:sin:100 또는 +TestWave:0.5
- 그리고 선언한 파형/연산들을 '[...]' 명령어로 연결해 변조시킬 수 있습니다.
- 예를 들어 '&TestWave:sin:100 &TestNote:tri' 이후에
  '[TestWave:200 > TestNote]' 하면 TestWave 파형으로
  변조지수 200만큼 TestNote가 변조되게 됩니다.
- '>'는 변조 그래프를 연결하라는 의미입니다.
- '[A:100 > B:200 > C]'와 '[A:100 > B] [B:200 > C]'와 같습니다.
- 변조지수, 변조에 쓰는 파형의 종류에 따라 소리가 매우 다양하게 변화됩니다.
- '>' 외에 '+'도 있는데
  '[[A:0.5 + B:0.5]:100 > C]'처럼 복잡하게 쓰입니다.
  먼저 '[A:0.5 + B:0.5]'만 보자면 파형 A와 B를 각각 0.5 비율
  (0~1)로 더한다는 의미입니다.
  이렇게 더한 파형을 Z라고 하면 식은 '[Z:100 > C]'로 볼 수 있고,
  이는 앞서 설명한 변조의 수행에 해당합니다.
- '+'도 '[A:0.3 + B:0.3 + C:0.4]'처럼 여러 개를 더할 수 있습니다.
- low, high는 입력 신호에서 특정 주파수 너머를 감쇄하는 역할을 합니다.
  선언 방법은 '&이름:low:주파수', '&이름:high:주파수'이며

      const PI_DIV_HALF = Math.PI / 180.0;
      const HALF_DIV_PI = 180.0 / Math.PI;

      // ##########################################################
      function showInfo(obj) {
        console.log(obj);
        for (var key in obj) {
          try {
            console.log(key + " : " + obj[key]);
          } catch (e) {
            console.log(key + " : ", e.name);
          }
        }
      }
      // ##########################################################
      // Degre -> Radian
      function d2r(degree) {
        return degree * PI_DIV_HALF;
      }
      // Radian -> Degree
      function r2d(radian) {
        return radian * HALF_DIV_PI;
      }
      // ##########################################################
      // num을 소수점 아래 digit번째까지 남기고 버림.
      function floor2(num, digit) {
        var pow = Math.pow(10, digit);
        return Math.floor(num * pow) / pow;
      }
      // num을 소수점 아래 digit번째 wkflfh dhffla.
      function ceil2(num, digit) {
        var pow = Math.pow(10, digit);
        return Math.ceil(num * pow) / pow;
      }
      // num을 소수점 아래 digit번째까지 남기고 반올림.
      function round2(num, digit) {
        var pow = Math.pow(10, digit);
        return Math.round(num * pow) / pow;
      }
      // num값을 최소 min, 최대 max로 제한시켜 반환합니다.
      function limitNumber(num, min, max) {
        if (num < min) return min;
        if (num > max) return max;
        return num;
      }
      // ##########################################################
      function formatInt(num, size, prefix) {
        var str = new String(Math.abs(num));
        var preStr = num < 0 ? "-" : "";
        var gap = size - str.length;
        for (var i = 0; i < gap; i++) {
          preStr += prefix;
        }
        return preStr + str;
      }
      // ##########################################################
      // 문자 ch가 숫자 문자인가?
      function isNum(ch) {
        return ch >= "0" && ch <= "9";
      }
      // 문자 ch가 알파벳인가?
      function isAlpha(ch) {
        return (ch >= "a" && ch <= "z") || (ch >= "A" && ch <= "Z");
      }
      // 문자 ch가 한글인가?
      function isHangul(ch) {
        return (
          (ch >= "가" && ch <= "힣") ||
          (ch >= "ㄱ" && ch <= "ㅎ") ||
          (ch >= "ㅏ" && ch <= "ㅣ")
        );
      }
      // ##########################################################
      // 이름 생성(임의의 10글자 알파벳)
      function makeName() {
        const ch = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
        let ret = "";
        for (let i = 0; i < 10; i++) {
          ret += ch.charAt(Math.floor(Math.random() * ch.length));
        }
        return ret;
      }

    <script type="text/javascript">
      /*
       * 페이지를 닫아도 유지되는 저장소.
       */
      // ##########################################################
      function Storage(name) {
        this.name = name + ".";
      }
      // ##########################################################
      // 저장소의 이름을 설정합니다.
      Storage.prototype.init = function (name) {
        this.name = name + ".";
      };
      // 저장소의 모든 값을 콘솔에 출력합니다.
      Storage.prototype.printAll = function () {
        var buf = "";
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key.indexOf(this.name) == 0) {
            buf += key + " : " + localStorage.getItem(key) + "\n";
          }
        }
        console.log(buf);
      };
      // 저장소의 모든 값을 제거합니다.
      Storage.prototype.clear = function () {
        for (var key in window.localStorage) {
          if (key.indexOf(this.name) == 0) {
            localStorage.removeItem(key);
          }
        }
      };
      // ##########################################################
      // 저장소가 key에 해당하는 값을 가지고 있는지 반환합니다.
      Storage.prototype.contains = function (key) {
        var realKey = this.name + key;
        return (
          realKey in window.localStorage &&
          window.localStorage[realKey] != undefined
        );
      };
      // 저장소의 key data를 저장합니다.
      Storage.prototype.set = function (key, data) {
        window.localStorage[this.name + key] = data;
      };
      // 저장소의 key에 해당하는 값을 제거합니다.
      Storage.prototype.remove = function (key) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          localStorage.removeItem(realKey);
        }
      };
      // 저장소의 key에 해당하는 값을 반환합니다.
      Storage.prototype.get = function (key) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return window.localStorage[realKey];
        }
        return undefined;
      };
      // 저장소의 key에 해당하는 값을 반환합니다. 없으면 defaultValue를 반환합니다.
      // 값은 문자열입니다.
      Storage.prototype.getOrDefault = function (key, defaultValue) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return window.localStorage[realKey];
        }
        return defaultValue;
      };
      // 저장소의 key에 해당하는 값을 정수형으로 바꾸어 반환합니다.
      Storage.prototype.getInt = function (key) {
        return parseInt(this.get(key));
      };
      // 저장소의 key에 해당하는 값을 정수형으로 바꾸어 반환합니다. 없으면 defaultValue를 반환합니다.
      Storage.prototype.getIntOrDefault = function (key, defaultValue) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return parseInt(window.localStorage[realKey]);
        }
        return defaultValue;
      };
      // 저장소의 key에 해당하는 값을 실수형으로 바꾸어 반환합니다.
      Storage.prototype.getFloat = function (key) {
        return parseFloat(this.get(key));
      };
      // 저장소의 key에 해당하는 값을 실수형으로 바꾸어 반환합니다. 없으면 defaultValue를 반환합니다.
      Storage.prototype.getFloatOrDefault = function (key, defaultValue) {
        var realKey = this.name + key;
        if (realKey in window.localStorage) {
          return parseFloat(window.localStorage[realKey]);
        }
        return defaultValue;
      };

      /*

      function Vector(x, y) {
        this.x = x;
        this.y = y;
      }
      // x와 y가 0인 벡터를 반환합니다.
      Vector.zero = function () {

      // ##########################################################
      // 현재 벡터의 x,y값을 재설정합니다.
      Vector.prototype.set = function (x, y) {
        this.x = x;

    <script type="text/javascript">
      /*
       * 마우스
       */
      // ##########################################################
      function Mouse() {
        this.NONE = 0;
        this.UP = 1;
        this.PRESS = 2;
        this.DOWN = 3;
        this.backBuffer = this.NONE;
        this.state = this.NONE;
        this.wheelBackBuffer = this.NONE;
        this.wheelState = this.NONE;
        this.client = null;
        this.cursor = new Vector(-1, -1);
        this.prevCursor = new Vector(-1, -1);
        this.deltaCursor = Vector.zero();
      }
      // ##########################################################
      Mouse.prototype.init = function (win, client) {
        this.client = client;
        this.cursor.x = win.innerWidth / 2;
        this.cursor.y = win.innerHeight / 2;
        this.prevCursor.x = this.cursor.x;
        this.prevCursor.y = this.cursor.y;
        win.onmousedown = this.whenDown.bind(this);
        win.onmouseup = this.whenUp.bind(this);
        win.onmousemove = this.whenMove.bind(this);
        win.onmousewheel = this.whenWheel.bind(this);
      };
      Mouse.prototype.reset = function () {
        this.backBuffer = this.NONE;
        this.state = this.NONE;
        this.wheelBackBuffer = this.NONE;
        this.wheelState = this.NONE;
        this.deltaCursor.set(0, 0);
      };
      Mouse.prototype.update = function () {
        var newState = this.backBuffer;
        if (this.state == this.DOWN) {
          this.state = this.PRESS;
        } else if (this.state == this.UP) {
          this.state = this.NONE;
        }
        if (newState == this.DOWN && this.state == this.NONE) {
          this.state = this.DOWN;
        } else if (newState == this.UP) {
          this.state = this.UP;
        }
        this.backBuffer = this.NONE;
        if (this.wheelState == this.DOWN || this.wheelState == this.UP) {
          this.wheelState = this.NONE;
        }
        this.wheelState = this.wheelBackBuffer;
        this.wheelBackBuffer = this.NONE;
        this.deltaCursor.x = this.cursor.x - this.prevCursor.x;
        this.deltaCursor.y = this.cursor.y - this.prevCursor.y;
        this.prevCursor.x = this.cursor.x;
        this.prevCursor.y = this.cursor.y;
      };
      // ##########################################################
      Mouse.prototype.calculateCursorFrom = function (arg) {
        var bounds = this.client.getBoundingClientRect();
        this.cursor.x = arg.clientX - bounds.left;
        this.cursor.y = arg.clientY - bounds.top;
      };
      Mouse.prototype.whenDown = function (arg) {
        this.backBuffer = this.DOWN;
        this.calculateCursorFrom(arg);
      };
      Mouse.prototype.whenUp = function (arg) {
        this.backBuffer = this.UP;
        this.calculateCursorFrom(arg);
      };
      Mouse.prototype.whenMove = function (arg) {
        this.calculateCursorFrom(arg);
      };
      Mouse.prototype.whenWheel = function (arg) {
        this.wheelBackBuffer = arg.wheelDelta > 0 ? this.UP : this.DOWN;
      };
      // ##########################################################
      // 마우스가 안눌린 상태에서 눌린 상태로 변환 시점인가?
      // 상승 예지
      Mouse.prototype.onDown = function () {
        return this.state == this.DOWN;
      };
      // 마우스가 눌린 상태에서 안눌린 상태로 변환 시점인가?
      // 하강 예지
      Mouse.prototype.onUp = function () {
        return this.state == this.UP;
      };
      // 마우스가 눌린 상태를 유지한 상태인가?
      Mouse.prototype.onPressed = function () {
        return this.state == this.PRESS;
      };
      // 마우스 휠이 위로 스크롤 된 상태로 변한 시점인가?
      Mouse.prototype.onWheelUp = function () {
        return this.wheelState == this.UP;
      };
      // 마우스 휠이 아래로 스크롤 된 시점인가?
      Mouse.prototype.onWheelDown = function () {
        return this.wheelState == this.DOWN;
      };
      // 캔버스에서의 마우스 좌표를 반환.
      Mouse.prototype.getCursor = function () {
        return this.cursor;
      };
      // 캔버스에서의ㅡ 마우스 좌표 변위를 반환
      Mouse.prototype.getDelta = function () {
        return this.deltaCursor;
      };
      // ##########################################################
      const g_mouse = new Mouse();

      /*

      // ##########################################################
      function Keyboard() {
        this.NONE = 0;
        this.UP = 1;
        this.PRESS = 2;
        this.DOWN = 3;
        this.BUFF_SIZE = 1024;
        this.backBuffer = new Array(this.BUFF_SIZE);
        this.buffer = new Array(this.BUFF_SIZE);
        this.state = new Array(this.BUFF_SIZE);
        this.continualDown = false;
        this.ignoreKey = false;
      }
      // ##########################################################
      Keyboard.prototype.init = function (win) {
        this.reset();
        win.onkeydown = this.whenDown.bind(this);
        win.onkeyup = this.whenUp.bind(this);
      };
      Keyboard.prototype.reset = function () {
        for (var i = 0; i < this.BUFF_SIZE; ++i) {
          this.backBuffer[i] = this.NONE;
          this.buffer[i] = this.NONE;
          this.state[i] = this.NONE;
        }
        this.ignoreFunctionKey(false);
      };
      Keyboard.prototype.update = function () {
        for (var i = 0; i < this.BUFF_SIZE; ++i) {
          this.buffer[i] = this.backBuffer[i];
          if (this.state[i] == this.DOWN) {
            this.state[i] = this.PRESS;
          } else if (this.state[i] == this.UP) {
            this.state[i] = this.NONE;
          }
          if (
            this.buffer[i] == this.DOWN &&
            (this.continualDown || this.state[i] == this.NONE)
          ) {
            this.state[i] = this.DOWN;
          } else if (this.buffer[i] == this.UP) {
            this.state[i] = this.UP;
          }
          this.backBuffer[i] = this.NONE;
        }
      };
      // 키를 꾹 눌렀을 때 onDown 이벤트가 지속적으로 발생하게 할지?
      // isOn(true): 지속적으로 발생.
      // isOn(false): 키를 누른 순간에만 발생.
      Keyboard.prototype.repeatDown = function (isOn) {
        this.continualDown = isOn;
      };
      // 브라우저가 키를 처리하지 않도록 할지?
      // isOn(true): 브라우저가 키를 처리하지 않음.
      // isOn(false): 브라우저가 키를 처리함.
      Keyboard.prototype.ignoreFunctionKey = function (isOn) {
        this.ignoreKey = isOn;
      };
      // ##########################################################
      Keyboard.prototype.whenDown = function (arg) {
        this.backBuffer[arg.keyCode] = this.DOWN;
        // 기능키는 처리되도록 함.
        if (
          arg.keyCode == Keys.F11 ||
          arg.keyCode == Keys.F12 ||
          arg.keyCode == Keys.F5
        ) {
          return true;

        if (arg.keyCode == Keys.Alt) {

        }
        return !this.ignoreKey;

        this.backBuffer[arg.keyCode] = this.UP;

      // ##########################################################
      // key가 안눌린 상태에서 눌린 상태로 변한 시점인가?
      // 상승 예지
      Keyboard.prototype.onDown = function (key) {
        return this.state[key] == this.DOWN;
      };
      // key가 눌린 상태에서 안눌린 상태로 변한 시점인가?
      // 하강 예지
      Keyboard.prototype.onUp = function (key) {
        return this.state[key] == this.UP;
      };
      // key가 눌린 상태를 유지한 상태인가?
      // repeatDown(true) 상태에서는 onDOwn에서도 true를 반환한다.
      Keyboard.prototype.onPressed = function (key) {
        return (
          this.state[key] == this.PRESS ||
          (this.continualDown && this.state[key] == this.DOWN)
        );
      };

      function init() {
        setCanvasSize(window.innerWidth - 32, window.innerHeight - 70);

        var canvas = document.getElementById("neurowhai");

        visibleLabelFile(false);
        board = new Board(canvas);
        graphics = new Graphics(board);
        graphics.setFont("돋움", "11px");
        g_mouse.init(window, canvas);
        g_keyboard.init(window);

        menu.style.left = canvas.offsetLeft + 16 + "px";
        menu.style.top = canvas.offsetTop + 96 + "px";

        seqPrevBox.style.left = canvas.offsetLeft + seqBoxPosition.x + "px";
        seqPrevBox.style.top = canvas.offsetTop + seqBoxPosition.y + "px";
        seqPrevBox.style.width = seqBoxSize.x + "px";
        seqPrevBox.style.height = seqBoxSize.y + "px";

        seqPrevBox.onfocus = function () {
          seqBoxMode = true;
        };

        seqPrevBox.onchange = function () {
          seqList.setOption(seqPrevBox.value);
        };

        sheetBox.style.left = canvas.offsetLeft + 16 + "px";
        sheetBox.style.top = canvas.offsetTop + 150 + "px";
        sheetBox.style.width = "1032px";
        sheetBox.style.height = canvas.height - 160 + "px";

        copyBox.style.left = sheetBox.style.left;
        copyBox.style.top = sheetBox.style.top;
        copyBox.style.width = sheetBox.style.width;
        copyBox.style.height = sheetBox.style.height;

        pasteBox.style.left = sheetBox.style.left;
        pasteBox.style.top = sheetBox.style.top;
        pasteBox.style.width = sheetBox.style.width;
        pasteBox.style.height = sheetBox.style.height;

        testSheet.position.set(1082, board.height - 110);

        visualizer.position.set(
          scrollBoxPosition.x + scrollWidth + 128,
          scrollBoxPosition.y,
        );
        visualizer.size.set(76, 24);

        seqList.init(16, 170, canvas.width - 16 * 2, canvas.height - 180);

        seqList.whenOptionChanged = function () {
          seqPrevBox.value = seqList.getOption();
        };

        seqList.whenCursorChanged = function (sender, targetBeat) {
          if (player.onPlaying()) {
            btnPlay.value = "Ⅱ";
          }

          playSequencer();
          player.setCurrentTime((targetBeat * seqList.timePerBeat) / 1000);
          seqList.restore();
          seqPrevBox.value = seqList.getOption();
        };

        fileReader.onload = function () {
          var sheet = fileReader.result;

          // 사진의 이 지점에는 문자열 치환 코드가 있으나
          // 정규식의 일부 문자가 판독되지 않습니다.
          if (sheetBox.hidden) {
            seqList.load(sheet);
            seqPrevBox.value = seqList.getOption();
          } else {
            var sheetTitle = MusicList.getTitleFromSheet(sheet);
            var goahead = true;

            if (sheetTitle.length > 0) {
              for (var s = 0; s < MusicList.getCount(); ++s) {
                if (MusicList.getTitle(s) === sheetTitle) {
                  if (
                    !confirm(
                      '"' +
                        sheetTitle +
                        '" 제목과 같은 곡이 이미 있습니다.\n불러오시겠습니까?',
                    )
                  ) {
                    goahead = false;
                  }
                  break;
                }
              }
            }

            if (goahead) {
              newMusic();
              sheetBox.value = sheet;
              saveSheet();
            }
          }
        };

        checkAuto.onchange = function () {
          if (checkAuto.checked) {
            checkLoop.checked = false;
          }
        };

        checkLoop.onchange = function () {
          if (checkLoop.checked) {
            checkAuto.checked = false;
          }
        };

        rangeVolume.onchange = function () {
          player.setVolume(rangeVolume.valueAsNumber / 100.0);
        };

        rangeVolume.onmousemove = function () {
          player.setVolume(rangeVolume.valueAsNumber / 100.0);
        };

        player.whenEnd = function () {
          if (sheetBox.hidden) {
            btnPlay.value = "▶";
          } else if (checkAuto.checked) {
            changeMusic(+1);
            player.play(sheetBox.value);
          } else if (checkLoop.checked) {
            player.play(sheetBox.value);
          } else {
            btnPlay.value = "▶";
          }
        };

        const droppane = document.querySelector(".droppane");

        window.ondragenter = function (arg) {
          if (arg.dataTransfer && arg.dataTransfer.items) {
            for (const item of arg.dataTransfer.items) {
              if (item.kind === "file" && item.type === "text/plain") {
                arg.preventDefault();
                droppane.style.display = "flex";
                return;
              }
            }
          }
        };

        window.ondragover = function (arg) {
          arg.preventDefault();
          arg.stopPropagation();
          return false;
        };

        window.ondragleave = function (arg) {
          arg.preventDefault();
          arg.stopPropagation();

          if (arg.target === droppane) {
            droppane.style.display = null;
          }

          return false;
        };

        window.ondrop = function (arg) {
          whenClickBtnStop();
          arg.preventDefault();
          arg.stopPropagation();

          if (arg.dataTransfer && arg.dataTransfer.items) {
            for (const item of arg.dataTransfer.items) {
              if (item.kind === "file" && item.type === "text/plain") {
                fileQueue.push(item.getAsFile());
              }
            }
          }

          droppane.style.display = null;
          return false;
        };

        initDemo();
        changeMusic(0);
        update();
      }

      function initDemo() {
        const defaultIndexKey = "default_sheet_ja_v1";
        if (g_db.contains(defaultIndexKey)) {
          const savedIndex = g_db.getInt(defaultIndexKey);
          if (savedIndex >= 0 && savedIndex < MusicList.getCount()) {
            musicIndex = savedIndex;
            return;
          }
        }
        // 기존에 저장한 악보는 유지하고 새 기본 곡을 한 번만 추가한다.
        musicIndex = MusicList.getCount();
        MusicList.saveSheet(musicIndex, defaultSheet);
        g_db.set(defaultIndexKey, musicIndex);
      }

      function update() {
        board.update();
        g_mouse.update();
        g_keyboard.update();
        updateFileQueue();
        player.update();

        if (!sheetBox.hidden) {
          testSheet.update();
        }

        if (g_mouse.onDown()) {
          var cursor = g_mouse.getCursor();

          // 스크롤 위치 변경
          if (
            cursor.x >= scrollBoxPosition.x &&
            cursor.x <= scrollBoxPosition.x + scrollWidth &&
            cursor.y > scrollBoxPosition.y - 8 &&
            cursor.y < scrollBoxPosition.y + 8
          ) {
            var pos = (cursor.x - scrollBoxPosition.x) / scrollWidth;
            if (!player.onPlaying()) {
              whenClickBtnPlay();
            }
            player.setCurrentTime(pos * player.getDuration());
          }

          // 시각화 정보 조정
          if (
            cursor.x > visualizer.position.x &&
            cursor.x < visualizer.position.x + visualizer.size.x &&
            cursor.y > visualizer.position.y - visualizer.size.y / 2 &&
            cursor.y < visualizer.position.y + visualizer.size.y / 2
          ) {
            visualizer.fftMode = !visualizer.fftMode;
          }

          // 시퀀서 설정 박스 클릭 여부 확인
          if (sheetBox.hidden) {
            if (
              cursor.x >= seqBoxPosition.x &&
              cursor.x < seqBoxPosition.x + seqBoxSize.x &&
              cursor.y > seqBoxPosition.y &&
              cursor.y < seqBoxPosition.y + seqBoxSize.y
            ) {
              seqBoxMode = true;
            } else {
              seqBoxMode = false;
              copyBox.hidden = true;
            }
          }
        }

        // 시퀀서 변경
        if (seqBoxMode === false && g_keyboard.onPressed(Keys.Shift)) {
          for (var i = 0; i <= 9; ++i) {
            if (
              g_keyboard.onDown(
                Keys[String.fromCharCode("0".charCodeAt(0) + i)],
              )
            ) {
              var num = i - 1;
              if (num < 0) num = 9;
              changeSequencer(num);
              break;
            }
          }
        }

        // 복사용 상자 숨기기
        if (g_keyboard.onDown(Keys.Escape)) {
          copyBox.hidden = true;
          pasteBox.hidden = true;
        }

        // 시각화 정보 갱신
        if (player.originMusic !== null) {
          var index = Math.floor(player.getCurrentTime() * 44100);
          var buffer = player.originMusic.getBuffer();
          visualizer.update(buffer, index);
        }

        if (sheetBox.hidden) {
          seqList.setMusicTime(player.getCurrentTime(), player.onPlaying());

          if (seqBoxMode === false) {
            seqList.update();
          }
        }

        // 스크롤 위치 계산
        var duration = player.getDuration();
        scrollPosition.set(
          scrollBoxPosition.x +
            (duration > 0 ? (player.getCurrentTime() * scrollWidth) / duration : 0),
          scrollBoxPosition.y,
        );

        board.reset();
        graphics.reset(board);
        render(graphics);
        window.requestAnimationFrame(update);
      }

      function render(g) {
        g.clear("white");

        if (sheetBox.hidden) {
          seqList.render(g);
        }

        // 스크롤 배경
        g.beginDrawLine("rgb(220, 220, 220)", 6);
        g.drawLine(
          scrollBoxPosition.x,
          scrollBoxPosition.y,
          scrollBoxPosition.x + scrollWidth,
          scrollBoxPosition.y,
        );
        g.endDrawLine();

        // 스크롤 진행량
        g.beginDrawLine("rgb(39, 155, 109)", 6);
        g.drawLine(
          scrollBoxPosition.x,
          scrollBoxPosition.y,
          scrollBoxPosition.x +
            (player.getDuration() > 0
              ? (player.getCurrentTime() * scrollWidth) / player.getDuration()
              : 0),
          scrollBoxPosition.y,
        );
        g.endDrawLine();

        // 스크롤 바
        g.beginFillCircle("rgb(39, 155, 109)");
        g.fillCircle(scrollPosition.x, scrollPosition.y, 2);
        g.endFillCircle();

        // 스크롤 사이드
        g.beginDrawLine("black", 4);
        g.drawLine(
          scrollBoxPosition.x,
          scrollBoxPosition.y - 8,
          scrollBoxPosition.x,
          scrollBoxPosition.y + 8,
        );
        g.drawLine(
          scrollBoxPosition.x + scrollWidth,
          scrollBoxPosition.y - 8,
          scrollBoxPosition.x + scrollWidth,
          scrollBoxPosition.y + 8,
        );
        g.endDrawLine();

        // 재생 시간
        g.beginDrawText("black", "14px");
        g.drawText(
          formatTime(player.getCurrentTime()) +
            " / " +
            formatTime(player.getDuration()),
          scrollBoxPosition.x + scrollWidth + 16,
          scrollBoxPosition.y + 6,
        );
        g.endDrawText();

        // 시각화 정보
        visualizer.render(g);

        // 곡명
        g.beginDrawText("black", "24px");
        g.drawText(musicTitle, 16, 40);
        g.endDrawText();

        // 테스트 시트
        if (!sheetBox.hidden) {
          testSheet.render(g);
        }
      }

      function updateFileQueue() {
        if (
          fileQueue.length > 0 &&
          fileReader.readyState !== fileReader.LOADING
        ) {
          var file = fileQueue.shift();
          fileReader.readAsText(file);
        }
      }

      function whenClickBtnFold() {
        whenClickBtnStop();
        sheetBox.hidden = !sheetBox.hidden;
        visibleLabelFile(false);

        if (sheetBox.hidden) {
          saveSheet();
          btnFold.value = "Code";
          btnNew.value = "Clear";
          checkAuto.hidden = true;
          checkLoop.hidden = true;
          lbCheckAuto.hidden = true;
          lbCheckLoop.hidden = true;
          checkAll.hidden = false;
          lbCheckAll.hidden = false;
          seqPrevBox.hidden = false;
          musicTitle = "Sequencer";
        } else {
          btnFold.value = "Seq";
          btnNew.value = "New";
          checkAuto.hidden = false;
          checkLoop.hidden = false;
          lbCheckAuto.hidden = false;
          lbCheckLoop.hidden = false;
          checkAll.hidden = true;
          lbCheckAll.hidden = true;
          seqPrevBox.hidden = true;
          copyBox.hidden = true;
          pasteBox.hidden = true;
          musicTitle = MusicList.getTitleFromSheet(sheetBox.value);
        }
      }

      function whenClickBtnPlay() {
        if (player.onPlaying()) {
          btnPlay.value = "▶";
          player.pause();
        } else {
          try {
            btnPlay.value = "Ⅱ";
            if (sheetBox.hidden) {
              playSequencer();
            } else {
              saveSheet();
              playCode();
            }
          } catch (error) {
            btnPlay.value = "▶";
            console.error(error);
            alert("재생 실패: " + error.message);
          }
        }
      }

      function whenClickBtnStop() {
        player.stop();
        btnPlay.value = "▶";
      }

      function whenClickBtnPrev() {
        if (sheetBox.hidden) {
          changeSequencer(seqList.currentSeq - 1);
        } else {
          changeMusic(-1);
        }
      }

      function whenClickBtnNext() {
        if (sheetBox.hidden) {
          changeSequencer(seqList.currentSeq + 1);
        } else {
          changeMusic(+1);
        }
      }

      function whenClickBtnNew() {
        if (sheetBox.hidden) {
          whenClickBtnStop();
          copyBox.hidden = true;
          pasteBox.hidden = true;
          seqList.clear();
        } else {
          newMusic();
        }
      }

      function whenClickBtnSave() {
        if (sheetBox.hidden) {
          var sheetText = seqList.build();
          seqList.backup();

          if (g_keyboard.onPressed(Keys.Shift)) {
            downloadData(sheetText, "code.text");
          } else {
            showCopyBox("Ctrl+C를 눌러 복사하세요.\n\n", sheetText);
          }
        } else {
          if (g_keyboard.onPressed(Keys.Shift)) {
            downloadData(sheetBox.value, "code.text");
          } else {
            saveSheet();
          }
        }
      }

      function whenClickBtnLoad() {
        whenClickBtnStop();

        if (sheetBox.hidden) {
          if (g_keyboard.onPressed(Keys.Shift)) {
            visibleLabelFile(true);
          } else {
            visibleLabelFile(false);
            showPasteBox("Ctrl+V를 눌러 붙여 넣으세요.\n\n", function (sheet) {
              // 사진의 정규식 치환 부분은 판독 불가
              seqList.load(sheet);
              seqPrevBox.value = seqList.getOption();
              g_keyboard.reset();
            });
          }
        } else {
          visibleLabelFile(lbFile.style.display === "none");
        }
      }

      function whenSelectFiles() {
        for (var i = 0; i < dlgFile.files.length; ++i) {
          fileQueue.push(dlgFile.files[i]);
        }

        dlgFile.value = "";
        visibleLabelFile(false);
        g_keyboard.reset();
      }

      function whenClickDlg() {
        visibleLabelFile(false);
      }

      function visibleLabelFile(visible) {
        if (visible) {
          lbFile.style.display = "inline-block";
        } else {
          lbFile.style.display = "none";
        }
      }

      function changeSequencer(num) {
        if (num < 0) {
          num = seqList.seq.length - 1;
        } else if (num >= seqList.seq.length) {
          num = 0;
        }

        seqList.setOption(seqPrevBox.value);
        seqList.changeSequencer(num);
        seqPrevBox.value = seqList.getOption();
      }

      function showCopyBox(description, content) {
        copyBox.value = description + content;
        copyBox.hidden = false;
        copyBox.select();
        copyBox.selectionStart = description.length;

        copyBox.oncopy = function (e) {
          e.clipboardData.setData("text/plain", content);
          copyBox.hidden = true;
          e.preventDefault();
        };

        copyBox.oncut = copyBox.oncopy;
      }

      function showPasteBox(description, callback) {
        pasteBox.value = description + " ";
        pasteBox.hidden = false;
        pasteBox.select();
        pasteBox.selectionStart = description.length;

        pasteBox.onpaste = function (e) {
          var sheet = e.clipboardData.getData("text/plain");

          pasteBox.hidden = true;
          e.preventDefault();

          if (sheet) {
            callback(sheet);
          }
        };
      }

      function playCode() {
        musicTitle = MusicList.getTitleFromSheet(sheetBox.value);
        player.play(sheetBox.value);
      }

      function playSequencer() {
        musicTitle = "Sequencer";
        var music = seqList.makeSound(checkAll.checked);
        player.playSound(music);
      }

      function changeMusic(move) {
        if (move !== 0) {
          saveSheet();
        }

        var musicCount = MusicList.getCount();
        musicIndex += move;

        if (musicIndex < 0) {
          musicIndex = musicCount - 1;
        } else if (musicIndex >= musicCount) {
          musicIndex = 0;
        }

        sheetBox.value = MusicList.getSheet(musicIndex);
        musicTitle = MusicList.getTitleFromSheet(sheetBox.value);

        if (musicTitle.length <= 0) {
          musicTitle = "Untitled";
        }
      }

      function saveSheet() {
        var sheet = sheetBox.value;

        if (sheet.trim().length > 0) {
          MusicList.saveSheet(musicIndex, sheet);
          musicTitle = MusicList.getTitleFromSheet(sheet);
        }
      }

      function newMusic() {
        saveSheet();

        var musicCount = MusicList.getCount();
        var targetIndex = musicCount;

        for (var i = 0; i < musicCount; ++i) {
          if (MusicList.getSheet(i).trim().length <= 0) {
            targetIndex = i;
            break;
          }
        }

        musicIndex = targetIndex;
        MusicList.saveSheet(targetIndex, "");
        sheetBox.value = "";
        musicTitle = "Untitled";
      }

      function formatTime(time) {
        var minutes = Math.floor(time / 60);
        var seconds = Math.floor(time - minutes * 60);

        return formatInt(minutes, 2, "0") + ":" + formatInt(seconds, 2, "0");
      }

      function downloadData(data, fileName) {
        var a = document.createElement("a");
        document.body.appendChild(a);
        a.style.display = "none";

        var blob = new Blob([data], { type: "octet/stream" });
        var url = window.URL.createObjectURL(blob);

        a.href = url;
        a.download = fileName;
        a.click();

        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      }
    </script>
  </head>

  <body onload="init()">
    <div class="droppane">파일을 끌어다 놓으세요.</div>

    <div class="wrap" id="wrap">
      <div class="banner" id="banner">
        <b>♬</b>&nbsp;
        <label class="titleLabel">ROKAF</label>
        Wave Player
      </div>

      <canvas id="neurowhai" width="1280" height="760">
        지원하지 않는 브라우저입니다.
      </canvas>

      <div class="menu" id="menu">
        <input
          type="button"
          id="btnFold"
          value="Seq"
          onclick="whenClickBtnFold()"
        />

        <input
          type="button"
          id="btnNew"
          value="New"
          onclick="whenClickBtnNew()"
        />

        <input
          type="button"
          id="btnSave"
          value="Save"
          onclick="whenClickBtnSave()"
        />

        <input
          type="button"
          id="btnLoad"
          value="Load"
          onclick="whenClickBtnLoad()"
        />

        <div class="filebox">
          <label for="dlgFile" id="lbFile"> 파일 선택 </label>

          <input
            type="file"
            id="dlgFile"
            accept="text/plain"
            multiple
            onchange="whenSelectFiles()"
            onclick="whenClickDlg()"
          />
        </div>

        <input
          type="button"
          id="btnPrev"
          value="|◀"
          onclick="whenClickBtnPrev()"
        />

        <input
          type="button"
          id="btnNext"
          value="▶|"
          onclick="whenClickBtnNext()"
        />

        <input
          type="button"
          id="btnPlay"
          value="▶"
          onclick="whenClickBtnPlay()"
        />

        <input
          type="button"
          id="btnStop"
          value="■"
          onclick="whenClickBtnStop()"
        />

        <input type="checkbox" id="checkAuto" />
        <label for="checkAuto" id="lbCheckAuto"> 연속 재생 </label>

        <input type="checkbox" id="checkLoop" />
        <label for="checkLoop" id="lbCheckLoop"> 반복 재생 </label>

        <input type="checkbox" id="checkAll" hidden />
        <label for="checkAll" id="lbCheckAll" hidden> 동시 재생 </label>

        <label for="rangeVolume"> 음량 </label>
        <input
          type="range"
          id="rangeVolume"
          min="0"
          max="100"
          value="100"
          step="1"
          style="width: 80px"
        />
      </div>

      <textarea id="seqPrevBox" hidden></textarea>
      <textarea id="sheetBox"></textarea>
      <textarea id="copyBox" hidden></textarea>
      <textarea id="pasteBox" hidden></textarea>
    </div>
  </body>
</html>
