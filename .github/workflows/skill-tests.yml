name: Validate MIDI Conversion Skill

on:
  push:
    branches: [main]
    paths:
      - '.agents/skills/midi-to-seq-dsl/**'
      - '.github/workflows/skill-tests.yml'
  pull_request:
    paths:
      - '.agents/skills/midi-to-seq-dsl/**'
      - '.github/workflows/skill-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r .agents/skills/midi-to-seq-dsl/requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s .agents/skills/midi-to-seq-dsl/tests -v
